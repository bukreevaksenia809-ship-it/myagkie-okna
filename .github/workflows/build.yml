name: Сборка и релиз

# Что делает:
#   • запускает анализ и тесты;
#   • собирает приложение под Windows (.exe) и macOS (.app/DMG);
#   • на тег v* (или при ручном запуске с версией) публикует GitHub Release
#     с готовыми архивами — их скачивает любой человек, Flutter ему не нужен.
#
# Как выпустить версию:
#   1) поднять версию в pubspec.yaml;
#   2) git tag v1.0.2 && git push origin v1.0.2   (или запустить вручную
#      во вкладке Actions и указать версию);
#   3) через несколько минут архив появится в разделе Releases.

on:
  push:
    branches: [main, master]
    tags: ['v*']
  workflow_dispatch:
    inputs:
      version:
        description: 'Версия релиза без буквы v (например 1.0.2). Пусто — только артефакты.'
        required: false
        default: ''

permissions:
  contents: write

env:
  # Та же версия, что сгенерировала папку windows/ и на которой писалась программа.
  FLUTTER_VERSION: '3.44.7'

jobs:
  test:
    name: Анализ и тесты
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Шрифты для тестов
        run: sudo apt-get update && sudo apt-get install -y fonts-liberation
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true
      - name: Зависимости
        run: flutter pub get
      - name: Анализ
        run: flutter analyze
      - name: Тесты
        run: flutter test


  android:
    name: Android (.apk)
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true

      - name: Зависимости
        run: flutter pub get

      - name: Подпись release (секреты GitHub)
        run: |
          echo "${{ secrets.ANDROID_KEYSTORE_BASE64 }}" | base64 -d > android/upload-keystore.jks
          printf 'storePassword=%s\nkeyPassword=%s\nkeyAlias=%s\nstoreFile=upload-keystore.jks\n' \
            "${{ secrets.ANDROID_KEYSTORE_PASSWORD }}" \
            "${{ secrets.ANDROID_KEY_PASSWORD }}" \
            "${{ secrets.ANDROID_KEY_ALIAS }}" > android/key.properties

      - name: Сборка APK и AAB (магазинная, без backend)
        run: |
          flutter build apk --release --dart-define=STORE_BUILD=true             --dart-define=OKNA_BACKEND="${{ secrets.OKNA_BACKEND }}"             --dart-define=OKNA_SECRET="${{ secrets.OKNA_SECRET }}"
          flutter build appbundle --release --dart-define=STORE_BUILD=true             --dart-define=OKNA_BACKEND="${{ secrets.OKNA_BACKEND }}"             --dart-define=OKNA_SECRET="${{ secrets.OKNA_SECRET }}"

      - name: Артефакт
        uses: actions/upload-artifact@v4
        with:
          name: MyagkieOknaExcl-android
          path: |
            build/app/outputs/flutter-apk/app-release.apk
            build/app/outputs/bundle/release/app-release.aab
          if-no-files-found: error

  windows:
    name: Windows (.exe)
    needs: test
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true

      - name: Зависимости
        run: flutter pub get

      - name: Сборка
        run: flutter build windows --release --dart-define=OKNA_BACKEND="${{ secrets.OKNA_BACKEND }}" --dart-define=OKNA_SECRET="${{ secrets.OKNA_SECRET }}"

      - name: Портативный архив
        shell: pwsh
        run: |
          $release = "build/windows/x64/runner/Release"
          # VC++ runtime app-local: без него чистая Windows 10/11 не запустит exe.
          foreach ($dll in @('msvcp140.dll','vcruntime140.dll','vcruntime140_1.dll','concrt140.dll')) {
            $source = Join-Path $env:SystemRoot "System32\$dll"
            if (Test-Path $source) { Copy-Item $source "$release\$dll" -Force }
          }
          # Дымовой запуск: убеждаемся, что exe стартует и не падает сразу.
          $process = Start-Process -FilePath "$release\MyagkieOknaExcl.exe" -PassThru
          Start-Sleep -Seconds 8
          if ($process.HasExited) {
            throw "Приложение завершилось сразу после запуска, код $($process.ExitCode)"
          }
          Stop-Process -Id $process.Id -Force
          New-Item -ItemType Directory -Force -Path dist | Out-Null
          Copy-Item packaging/README-WINDOWS.txt "$release/ЧИТАЙ-МЕНЯ.txt" -Force
          Compress-Archive -Path "$release/*" `
            -DestinationPath dist/MyagkieOknaExcl-windows.zip -Force
          Get-Item dist/MyagkieOknaExcl-windows.zip | Select-Object Name, Length

      - name: Артефакт
        uses: actions/upload-artifact@v4
        with:
          name: MyagkieOknaExcl-windows
          path: dist/MyagkieOknaExcl-windows.zip
          if-no-files-found: error

      - name: Релиз
        if: startsWith(github.ref, 'refs/tags/') || inputs.version != ''
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if ("${{ github.ref_type }}" -eq "tag") { $tag = "${{ github.ref_name }}" }
          else { $tag = "v${{ inputs.version }}" }
          Write-Host "Публикую релиз $tag"
          gh release view $tag --repo ${{ github.repository }} 2>$null
          if ($LASTEXITCODE -ne 0) {
            gh release create $tag --repo ${{ github.repository }} `
              --title "Мягкие окна Excl $tag" `
              --notes "Сборка приложения «Мягкие окна Excl»: чертежи, раскрой, раскладка на рулонах и ведомость расхода.`n`n**Windows:** скачайте ``MyagkieOknaExcl-windows.zip``, распакуйте целиком и запустите ``MyagkieOknaExcl.exe``.`n**macOS:** скачайте DMG или zip."
          }
          gh release upload $tag dist/MyagkieOknaExcl-windows.zip `
            --repo ${{ github.repository }} --clobber

  macos:
    name: macOS (.app, DMG)
    needs: test
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true

      - name: Зависимости
        run: flutter pub get

      - name: Сборка
        run: flutter build macos --release --dart-define=OKNA_BACKEND="${{ secrets.OKNA_BACKEND }}" --dart-define=OKNA_SECRET="${{ secrets.OKNA_SECRET }}"

      - name: Архивы
        run: |
          set -e
          APP="build/macos/Build/Products/Release/MyagkieOknaExcl.app"
          codesign --deep --force --sign - "$APP" || true
          mkdir -p dist/dmg
          cp -R "$APP" dist/dmg/
          ln -s /Applications dist/dmg/Applications
          hdiutil create -volname "Мягкие окна Excl" -srcfolder dist/dmg -ov \
            -format UDZO dist/MyagkieOknaExcl-macos.dmg
          ditto -c -k --sequesterRsrc --keepParent "$APP" \
            dist/MyagkieOknaExcl-macos.zip
          ls -lh dist

      - name: Артефакт
        uses: actions/upload-artifact@v4
        with:
          name: MyagkieOknaExcl-macos
          path: |
            dist/MyagkieOknaExcl-macos.dmg
            dist/MyagkieOknaExcl-macos.zip
          if-no-files-found: error

      - name: Релиз
        if: startsWith(github.ref, 'refs/tags/') || inputs.version != ''
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -e
          if [ "${{ github.ref_type }}" = "tag" ]; then
            TAG="${{ github.ref_name }}"
          else
            TAG="v${{ inputs.version }}"
          fi
          echo "Публикую релиз $TAG"
          gh release view "$TAG" --repo ${{ github.repository }} >/dev/null 2>&1 || \
            gh release create "$TAG" --repo ${{ github.repository }} \
              --title "Мягкие окна Excl $TAG" \
              --notes "Сборка приложения «Мягкие окна Excl»: чертежи, раскрой, раскладка на рулонах и ведомость расхода."
          gh release upload "$TAG" \
            dist/MyagkieOknaExcl-macos.dmg dist/MyagkieOknaExcl-macos.zip \
            --repo ${{ github.repository }} --clobber
